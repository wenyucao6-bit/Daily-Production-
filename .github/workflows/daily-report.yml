name: Daily Production Report

on:
  schedule:
    # cron 时间是 UTC。这里设的是 UTC 06:00
    # 对应巴黎时间：冬令时(CET, UTC+1) 07:00 / 夏令时(CEST, UTC+2) 08:00
    # 如果想要固定的巴黎本地时间，需要在每年3月/10月夏令时切换时手动改这行
    - cron: "42 5 * * *"
  workflow_dispatch: {}   # 允许在 GitHub 网页上手动点击运行，方便测试

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report script
        env:
          CGNEE_API_TOKEN: ${{ secrets.CGNEE_API_TOKEN }}
          SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
        run: python Daily_PRO.py

      # 即使邮件发送失败，也把生成的Excel作为Artifact留存，方便排查/下载
      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-production-report
          path: output/*.xlsx
          retention-days: 30
